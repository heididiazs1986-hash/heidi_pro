<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heidi Life OS</title>
<style>
body{font-family:sans-serif;background:#f6f3ff;margin:0}
.screen{display:none;padding:20px}
.screen.active{display:block}
nav{position:fixed;bottom:0;width:100%;display:flex;background:#fff;border-top:1px solid #ccc}
nav button{flex:1;padding:15px;font-size:16px}
.card{background:#fff;padding:15px;border-radius:12px;margin:10px 0}
</style>
</head>
<body>

<div id="home" class="screen active">
<h2>Inicio</h2>
<div class="card">Resumen del día</div>
</div>

<div id="habits" class="screen">
<h2>Hábitos</h2>
<div class="card">Alcohol y cigarrillo</div>
</div>

<div id="money" class="screen">
<h2>Dinero</h2>
<div class="card">Finanzas</div>
</div>

<nav>
<button onclick="go('home')">Inicio</button>
<button onclick="go('habits')">Hábitos</button>
<button onclick="go('money')">Dinero</button>
</nav>

<script>
function go(id){
document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
document.getElementById(id).classList.add('active');
}
</script>

</body>
</html>
